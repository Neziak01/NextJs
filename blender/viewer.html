<style>

body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg));color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}

h1{font:600 22px/1.1 Fraunces,Georgia,serif;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.meta{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 13px "IBM Plex Sans",sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

</style>

const buf=Uint8Array.from(atob(GLB),c=>c.charCodeAt(0)).buffer;
new THREE.GLTFLoader().parse(buf,'',g=>{
  let objs=0,tris=0;
  g.scene.traverse(o=>{
    if(o.isMesh){objs++;o.castShadow=o.receiveShadow=true;
      const n=o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count;tris+=n/3;
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.flatShading=true;m.needsUpdate=true;mats.push(m)});}
    if(o.isLight||o.isCamera)o.visible=false;
  });
  scene.add(g.scene);
  document.getElementById('m-obj').textContent=objs+' objets';
  document.getElementById('m-tri').textContent=Math.round(tris).toLocaleString('fr-FR')+' triangles';
  document.getElementById('status').hidden=true;
},e=>{document.getElementById('status').textContent='Échec du chargement du modèle : '+e.message});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const bRot=document.getElementById('b-rot'),bWire=document.getElementById('b-wire');
bRot.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;bRot.setAttribute('aria-pressed',ctl.autoRotate)};
bWire.onclick=()=>{const on=bWire.getAttribute('aria-pressed')!=='true';mats.forEach(m=>m.wireframe=on);bWire.setAttribute('aria-pressed',on)};
document.getElementById('b-reset').onclick=()=>{cam.position.copy(home);ctl.target.set(0,0.8,0)};
(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();
</script>
